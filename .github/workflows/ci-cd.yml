name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Validating branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|refactor|docs|test|chore|hotfix)/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            echo ""
            echo "Allowed formats:"
            echo "  feature/*"
            echo "  fix/*"
            echo "  refactor/*"
            echo "  docs/*"
            echo "  test/*"
            echo "  chore/*"
            echo "  hotfix/*"
            exit 1
          fi

          echo "Branch name is valid."
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck (shared)
        run: pnpm --filter=@gym/shared run build

      - name: Run typecheck (services)
        run: pnpm --filter=services/* run build

      - name: Run typecheck (frontend)
        run: pnpm --filter=frontend run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (unit only - integration tests require separate setup)
        run: pnpm test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-testing-purposes-only
          NODE_ENV: test

  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter=@gym/shared build

      - name: Build services
        run: pnpm --filter=services/* build

      - name: Build frontend
        run: pnpm --filter=frontend build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            services/**/dist
            frontend/dist
          retention-days: 7

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/auth-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-auth-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-auth-service:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-auth-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/client-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-client-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-client-service:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-client-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push membership-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/membership-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-membership-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-membership-service:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-membership-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/payment-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-payment-service:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-payment-service:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-payment-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-api-gateway:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-api-gateway:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-api-gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gym-frontend:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/gym-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gym-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Placeholder)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "::warning::DEPLOYMENT PLACEHOLDER - No real staging infrastructure configured"
          echo "To enable staging deployment, add your deployment commands here."
          echo "Example: kubectl apply -f k8s/staging/  OR  docker-compose -f docker-compose.staging.yml up -d"
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_STAGING }}

  deploy-production:
    name: Deploy to Production (Placeholder)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "::warning::DEPLOYMENT PLACEHOLDER - No real production infrastructure configured"
          echo "To enable production deployment, add your production deployment commands here."
          echo "Example: kubectl apply -f k8s/production/"
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_PROD }}