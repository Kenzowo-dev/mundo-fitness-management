name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.24.0'

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Validating branch: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|refactor|docs|test|chore|hotfix)/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            echo ""
            echo "Allowed formats:"
            echo "  feature/*"
            echo "  fix/*"
            echo "  refactor/*"
            echo "  docs/*"
            echo "  test/*"
            echo "  chore/*"
            echo "  hotfix/*"
            exit 1
          fi

          echo "Branch name is valid."

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck (shared)
        run: pnpm --filter=@gym/shared run build

      - name: Run typecheck (services)
        run: pnpm --filter='./services/*' run build

      - name: Run typecheck (frontend)
        run: pnpm --filter=frontend run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter=@gym/shared build

      - name: Run tests (unit only)
        run: pnpm test:unit
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-testing-purposes-only
          NODE_ENV: test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter=@gym/shared build

      - name: "Run integration tests (Testcontainers: PostgreSQL + Redis)"
        run: pnpm test:integration
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: integration-secret-key-for-testing-purposes-only

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter=@gym/shared build

      - name: Build services
        run: pnpm --filter='./services/*' run build

      - name: Build frontend
        run: pnpm --filter=frontend run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            services/**/dist
            frontend/dist
          retention-days: 7

  docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push auth-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/auth-service:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/client-service/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/client-service:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/client-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push membership-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/membership-service/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/membership-service:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/membership-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push payment-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/payment-service/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/payment-service:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/api-gateway:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/kenzowo-dev/mundo-fitness-management/frontend:latest
            ghcr.io/kenzowo-dev/mundo-fitness-management/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose --env-file .env.docker.example -f compose.yaml config --quiet
          docker compose --env-file .env.docker.example -f compose.yaml -f compose.local.yaml config --quiet
        env:
          COMPOSE_IGNORE_ORPHANS: 1
