    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: gym-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gym_db}
      POSTGRES_USER: ${POSTGRES_USER:-gym_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 200
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3001
      CLIENT_SERVICE_URL: http://client-service:3002
      MEMBERSHIP_SERVICE_URL: http://membership-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      PLAN_SERVICE_URL: http://plan-service:3005
      REPORT_SERVICE_URL: http://report-service:3006
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      membership-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      plan-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gym-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: gym-network